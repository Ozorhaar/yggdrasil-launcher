name: forge-launcher
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "thingward/**", ".github/workflows/thingward.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions pinned to exact commits, so a moved tag can't change what runs here
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK packages (the runner image ships the Android SDK)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          gradle-version: "8.11.1"
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.YGG_KEYSTORE_B64 }}
        run: |
          # never publish a debug-signed release
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::No signing key secret"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ygg.p12"
          echo "YGG_KEYSTORE=$RUNNER_TEMP/ygg.p12" >> "$GITHUB_ENV"
      - name: Build
        env:
          YGG_KEYSTORE_PASSWORD: ${{ secrets.YGG_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Rename APK and checksum
        run: |
          # 2.0.0 was CI run 88; versions count up from it (the same rule as app/build.gradle.kts)
          V="2.0.$(( ${{ github.run_number }} - 88 ))"
          echo "YGG_VERSION=$V" >> "$GITHUB_ENV"
          A="YggdrasilLauncher-$V.apk"
          cp app/build/outputs/apk/release/app-release.apk "$A"
          sha256sum "$A" | tee "$A.sha256"
          rm -f "$RUNNER_TEMP/ygg.p12"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: YggdrasilLauncher
          path: YggdrasilLauncher-*.apk
      - name: Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: v${{ env.YGG_VERSION }}
          name: Yggdrasil Launcher ${{ env.YGG_VERSION }}
          files: |
            YggdrasilLauncher-*.apk
            YggdrasilLauncher-*.apk.sha256
          make_latest: true
